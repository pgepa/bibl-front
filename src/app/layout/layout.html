<div class="shell">
  <aside class="sidebar">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>Bibl</strong>
        <small>Acervo &amp; empréstimos</small>
      </span>
    </a>

    <nav class="nav" aria-label="Principal">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <p class="sidebar-note">Gestão simples do acervo da biblioteca.</p>
  </aside>

  <div class="main">
    <header class="topbar">
      <p>Biblioteca municipal · painel interno</p>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
